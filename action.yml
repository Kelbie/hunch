name: Hunch
description: Semantic review against plain-English rules and compiled agent skills.
branding: { icon: eye, color: purple }
inputs:
  base:
    description: Trusted base commit SHA (required outside pull_request events).
    required: false
  head:
    description: Head commit SHA to review (required outside pull_request events).
    required: false
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.5
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --ignore-scripts --production
    - shell: bash
      env:
        HUNCH_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        HUNCH_HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        [[ "$HUNCH_BASE" =~ ^[a-f0-9]{40}$ && "$HUNCH_HEAD" =~ ^[a-f0-9]{40}$ ]] || { echo "Valid base and head SHAs required"; exit 2; }
        git cat-file -e "$HUNCH_BASE^{commit}"
        git cat-file -e "$HUNCH_HEAD^{commit}"
        # Run from the action's own directory so a reviewed repository's bunfig.toml cannot preload code.
        cd "$GITHUB_ACTION_PATH"
        bun packages/cli/src/bin.ts check --cwd "$GITHUB_WORKSPACE" --base "$HUNCH_BASE" --head "$HUNCH_HEAD" --policy-ref "$HUNCH_BASE" --reporter github
