name: release
on:
  push:
    branches: [main]
permissions:
  contents: write # gh release create
  id-token: write # npm provenance
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile

      # A push to main is not itself a release: publish only the versions npm has never seen,
      # so ordinary commits are a no-op and a re-run cannot fail on a duplicate version.
      - id: version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@kelbie/hunch@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@kelbie/hunch@$version is already on npm; nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.published == 'false'
        run: bun run check
      - if: steps.version.outputs.published == 'false'
        run: node scripts/package-smoke.mjs

      - if: steps.version.outputs.published == 'false'
        name: Publish to npm
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.version.outputs.published == 'false'
        name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes
