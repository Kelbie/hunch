# GitHub App permission reference (not an uploadable manifest).
# Register using the form and instructions in docs/deploy.md.
name: hunch
url: https://github.com/kelbie/hunch
description: Gut-checks every PR against plain-English rules and agent skills with TypeSafe's Jev.
public: false
hook_attributes:
  url: https://YOUR-DEPLOYMENT.vercel.app/api/webhook
default_events:
  - pull_request
  - issue_comment
default_permissions:
  contents: read
  metadata: read
  issues: read
  pull_requests: write
  checks: write
