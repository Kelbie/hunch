  "sources": [
    {
      "id": "skill/codebase-design",
      "kind": "skill",
      "origin": "./.agents/skills/codebase-design",
      "path": ".agents/skills/codebase-design/SKILL.md",
      "scope": "",
      "hash": "ed4a1837af02ce111aa6613e9a04e3bbcc07e7732fe0c613cda2b6035404b8d6",
      "rules": [
        {
          "id": "skill/codebase-design/inject-external-dependencies",
          "section": "Codebase Design > Designing for testability",
          "message": "Constructing an external dependency inside business logic prevents tests from substituting it.",
          "instructions": "Does `hunk` introduce business logic that constructs its own service or I/O dependency instead of accepting it as an injected dependency?",
          "criteria": {
            "true": "A business operation directly constructs a concrete payment gateway, network client, or other I/O dependency for its own use, such as processOrder constructing StripeGateway.",
            "false": "The operation receives the dependency through a parameter or constructor. Construction wires an adapter into a module outside the business operation. Internal pure computation and in-memory implementation parts are allowed."
          },
          "appliesTo": []
        },
        {
          "id": "skill/codebase-design/return-calculated-results",
          "section": "Codebase Design > Designing for testability",
          "message": "A calculation communicates its result by mutating caller-owned state.",
          "instructions": "Does `hunk` introduce a calculation that communicates its result by mutating its input instead of returning the result?",
          "criteria": {
            "true": "A calculation updates a field on its input to convey the computed value, such as applying a discount by subtracting from cart.total, instead of returning the calculated result.",
            "false": "The calculation returns its result. Mutation is confined to local implementation state or constructs the returned value. An operation performs I/O or manages state rather than serving as a calculation."
          },
          "appliesTo": []
        },
        {
          "id": "skill/codebase-design/assert-observable-outcomes",
          "section": "Deepening > Testing strategy: replace, don't layer",
          "message": "A test depends on private implementation state instead of observable outcomes.",
          "instructions": "Does `hunk` add a test assertion that bypasses the tested module's interface to inspect its private implementation state?",
          "criteria": {
            "true": "An assertion accesses explicitly private implementation state through an access-control escape or test-only exposure rather than asserting a result observable through the tested interface.",
            "false": "Assertions use returned results or state intentionally exposed through the interface. Tests exercise a sanctioned internal seam through that seam's own interface; internal seams and tests of them are expressly allowed."
          },
          "appliesTo": []
        }
      ],
      "notChecked": [
        {
          "section": "Codebase Design > Glossary; Relationships; Rejected framings",
          "reason": "These define design vocabulary and conceptual relationships; enforcing terminology is editorial, while measuring depth or interpreting the full interface requires broader design context."
        },
        {
          "section": "Codebase Design > Deep vs shallow; Principles > Depth; The deletion test",
          "reason": "Interface simplicity, leverage, locality, and whether complexity would spread to callers are subjective or require inspecting callers and the wider implementation."
        },
        {
          "section": "Codebase Design > Principles > One adapter; Deepening > Seam discipline > One adapter",
          "reason": "Determining how many adapters exist or are justified requires counts and cross-file design context."
        },
        {
          "section": "Codebase Design > Designing for testability > Small surface area",
          "reason": "Surface size and parameter simplicity require counting or subjective design judgments."
        },
        {
          "section": "Deepening > Dependency categories",
          "reason": "Dependency ownership, available stand-ins, production and test adapter wiring, and module-level placement of ports generally require cross-file evidence; locally visible dependency construction is covered by the injection rule."
        },
        {
          "section": "Deepening > Seam discipline > Internal seams vs external seams",
          "reason": "Determining whether a seam is exposed solely for tests requires caller and test usage beyond a single chunk."
        },
        {
          "section": "Codebase Design > Principles > The interface is the test surface; Deepening > Testing strategy: replace, don't layer",
          "reason": "Private-state assertions are covered by a rule, but replacement coverage, obsolete test deletion, and resilience to future refactors require cross-file or hypothetical analysis."
        },
        {
          "section": "Codebase Design > Going deeper; Design It Twice > Process",
          "reason": "Reading related guidance, framing problems, spawning agents, presenting alternatives, and recommending designs are workflow requirements rather than code conditions."
        }
      ]
    },
    {
      "id": "agents-md/root",
      "kind": "agents-md",
      "origin": "./AGENTS.md",
      "path": "AGENTS.md",
      "scope": "",
      "hash": "af3fa058861b907250a8cf7bb2067b1447881145fa76db71e1c98044f8ebb68c",
      "rules": [
        {
          "id": "agents-md/root/preserve-review-failures",
          "section": "Hunch contributor guidance",
          "message": "A missing input, provider failure or partial review may be reported as success.",
          "instructions": "Does `hunk` convert missing review data, a provider failure or an incomplete review into a successful review result?",
          "criteria": {
            "true": "An error or missing-data branch returns a clean report, successful status or fabricated passing provider answer.",
            "false": "The result preserves the failure or explicitly identifies incomplete coverage; recovery obtains valid data before reporting success."
          },
          "appliesTo": []
        },
        {
          "id": "agents-md/root/use-immutable-base-guidance",
          "section": "Hunch contributor guidance",
          "message": "A PR may control the configuration or guidance used to judge itself.",
          "instructions": "Does `hunk` load configuration or compiled guidance for judging a PR from a revision other than its immutable base commit?",
          "criteria": {
            "true": "Review policy is explicitly read from the PR head, a mutable branch reference or the current working tree instead of the immutable base commit.",
            "false": "Policy is read using the immutable base commit; PR head content is read only as material being reviewed."
          },
          "appliesTo": []
        },
        {
          "id": "agents-md/root/avoid-credentialed-pr-execution",
          "section": "Hunch contributor guidance",
          "message": "PR-controlled code may execute with credentials.",
          "instructions": "Does `hunk` execute PR-supplied configuration or scripts in an environment containing credentials?",
          "criteria": {
            "true": "PR configuration is dynamically evaluated or PR scripts are launched while authentication tokens or other credentials are supplied or visibly inherited.",
            "false": "PR configuration is parsed as inert data, or execution is explicitly isolated from credentials."
          },
          "appliesTo": []
        },
        {
          "id": "agents-md/root/authenticate-before-queueing",
          "section": "Hunch contributor guidance",
          "message": "An unauthenticated webhook may enqueue work.",
          "instructions": "Does `hunk` enqueue webhook work before successful webhook authentication?",
          "criteria": {
            "true": "A webhook handler queues a job before checking authentication, or its authentication-failure path still queues work.",
            "false": "Successful authentication gates queue submission; rejected webhook requests exit before queueing."
          },
          "appliesTo": []
        },
        {
          "id": "agents-md/root/avoid-publishing-raw-error-bodies",
          "section": "Hunch contributor guidance",
          "message": "A published report may expose a raw error body.",
          "instructions": "Does `hunk` publish an unfiltered raw error body?",
          "criteria": {
            "true": "An upstream error response body is directly included in a published review, comment or public response.",
            "false": "Publication uses a controlled error classification or sanitized summary instead of the raw body."
          },
          "appliesTo": []
        },
        {
          "id": "agents-md/root/avoid-publishing-credentials",
          "section": "Hunch contributor guidance",
          "message": "Published output may expose credentials.",
          "instructions": "Does `hunk` include credential values in published output?",
          "criteria": {
            "true": "A token, password, authentication header or other credential value is interpolated into a published report, comment or public response.",
            "false": "Credential values are omitted or redacted; output contains only credential names or references."
          },
          "appliesTo": []
        },
        {
          "id": "agents-md/root/avoid-generated-finding-explanations",
          "section": "Hunch contributor guidance",
          "message": "A finding may present a model-generated explanation as review guidance.",
          "instructions": "Does `hunk` use a model-generated explanation as the text of a review finding?",
          "criteria": {
            "true": "Finding text is populated from provider-generated rationale or explanation prose.",
            "false": "Finding text comes from the configured concern, with the model providing a score rather than explanatory prose."
          },
          "appliesTo": []
        },
        {
          "id": "agents-md/root/exclude-deterministic-policy-checks",
          "section": "Hunch contributor guidance",
          "message": "A preset or project policy may ask Hunch to perform a deterministic lint or type check.",
          "instructions": "Does `hunk` add a Hunch preset or project-policy concern that is fully decidable by a linter or type checker?",
          "criteria": {
            "true": "A configured model question checks only formatting, syntactic conventions or compiler-enforced type correctness.",
            "false": "The concern requires semantic judgment; deterministic checks are configured in lint or type-check tooling instead."
          },
          "appliesTo": []
        }
      ],
      "notChecked": [
        {
          "section": "Hunch contributor guidance > Installed skills",
          "reason": "Using installed skills is a process requirement, and their contents are not supplied."
        },
        {
          "section": "Hunch contributor guidance > Engine and repository-reader architecture",
          "reason": "Module independence, reader abstractions and the complete check interface require cross-file architectural evidence."
        },
        {
          "section": "Hunch contributor guidance > Interface design",
          "reason": "Caller-oriented interfaces, ownership of sequencing and hypothetical abstractions require design context or subjective judgment."
        },
        {
          "section": "Hunch contributor guidance > Untrusted data",
          "reason": "The general trust requirement does not specify additional concrete local checks beyond the extracted execution, authentication and publication rules."
        },
        {
          "section": "Hunch contributor guidance > Finding provenance and coverage",
          "reason": "Proving that every finding has a configured concern and model score, or that all incomplete coverage is reported, requires following data across modules; locally visible success conversion is covered."
        },
        {
          "section": "Hunch contributor guidance > Validation commands and packed artifact",
          "reason": "Installing, running checks and exercising the packed artifact are process requirements."
        },
        {
          "section": "Hunch contributor guidance > Test strategy",
          "reason": "Real module boundaries and adequate trust, error and publication coverage require implementation and suite-wide context."
        },
        {
          "section": "Hunch contributor guidance > User documentation",
          "reason": "Documentation routing, generated-file provenance, live capture procedures and documentation test coverage require cross-file or process evidence; README brevity is subjective."
        },
        {
          "section": "Hunch contributor guidance > Images",
          "reason": "Rendering and capture provenance cannot be established from a code chunk."
        },
        {
          "section": "Hunch contributor guidance > Live quality and deployment claims",
          "reason": "Validating claims against actual live runs or deployment evidence requires information outside the chunk."
        }
      ]
    }
  ],
  "selectionHash": "b83ebae0413421c45ad5e687456247cb2f68838a6308a0b4fade851942682ef1"
}
