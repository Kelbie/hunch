        {
          "id": "skill/codebase-design/caller-bookkeeping",
          "section": "Depth and small interfaces",
          "instructions": "Does added code in `hunk` expose internal bookkeeping operations that force a caller to coordinate implementation steps instead of requesting its intended task?",
          "message": "Keep internal bookkeeping inside the module that owns it.",
          "criteria": {
            "true": "The added or changed code clearly demonstrates the concern.",
            "false": "The code does not demonstrate it, or the hunk lacks enough evidence."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.rs"
          ]
        },
        {
          "id": "skill/codebase-design/hypothetical-adapter",
          "section": "One adapter means a hypothetical seam",
          "instructions": "Does `hunk` add an abstraction whose only stated purpose is a hypothetical future provider, while the visible code has only one implementation and no current varying behavior?",
          "message": "Introduce abstractions for actual variation, not hypothetical providers.",
          "criteria": {
            "true": "The added or changed code clearly demonstrates the concern.",
            "false": "The code does not demonstrate it, or the hunk lacks enough evidence."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.rs"
          ]
        },
        {
          "id": "skill/codebase-design/test-private-details",
          "section": "The interface is the test surface",
          "instructions": "Does a test added in `hunk` couple its assertion to a private implementation detail instead of the observable behavior of the public interface?",
          "message": "Test observable behavior through the public interface.",
          "criteria": {
            "true": "The added or changed code clearly demonstrates the concern.",
            "false": "The code does not demonstrate it, or the hunk lacks enough evidence."
          },
          "appliesTo": [
            "**/*.ts",
            "**/*.tsx",
            "**/*.rs"
          ]
        }
      ],
      "notChecked": [
        {
          "section": "Whole-project architecture and design exercises",
